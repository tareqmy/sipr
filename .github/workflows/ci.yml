name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check licenses, sources, and advisories
        uses: EmbarkStudios/cargo-deny-action@v2

  # The release matrix in cd.yml builds for macOS and Windows; this job catches
  # a portability break on a pull request rather than on a tag.
  portability:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      # Serial: the e2e and media tests drive real sockets, spawn sipr
      # processes, and pick ports by probing; run in parallel on the 3-core
      # shared runners they starve each other's pacers and echo threads and
      # race for ports. One at a time they are deterministic. This job is
      # about portability, not speed.
      - name: Tests
        run: cargo test --workspace --no-fail-fast -- --test-threads=1

  # The interop oracle is SIPp 3.7 built from source (as on the development
  # host); the distro package is 3.6 and lacks the TLS/PCAP/SCTP surface the
  # suite exercises. SIPP_SRC points the scenario-based tests at its corpus.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build real SIPp 3.7 with TLS, PCAP, SCTP, and GSL
        run: |
          sudo modprobe sctp || true
          sudo apt-get update
          sudo apt-get install -y cmake libsctp-dev libpcap-dev libncurses-dev libssl-dev libgsl-dev
          git clone --depth 1 --branch v3.7.7 https://github.com/SIPp/sipp.git /tmp/sipp
          cd /tmp/sipp && cmake . -DUSE_SCTP=1 -DUSE_PCAP=1 -DUSE_SSL=1 -DUSE_GSL=1 && make -j"$(nproc)"
          /tmp/sipp/sipp -v | head -1
      - name: Interop against real SIPp
        run: SIPP_BIN=/tmp/sipp/sipp SIPP_SRC=/tmp/sipp cargo test --test interop -- --nocapture

  # Every parser that reads untrusted bytes has a libFuzzer target under
  # fuzz/ (docs/TESTING.md §6). A short run per push is the point: a crash
  # or a hang in a parser is a real bug, and libFuzzer finds the shallow
  # ones in seconds. The seed corpora are checked in; the reproducer for a
  # finding is uploaded so it can become a regression test.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz every target for 30s
        run: scripts/fuzz.sh 30
      - name: Upload the reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # SCTP needs an OS stack and a sipp built with USE_SCTP; only Linux has both.
  sctp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Load the SCTP kernel module
        run: sudo modprobe sctp && cat /proc/net/protocols | grep -i sctp
      - name: Build real SIPp with SCTP
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libsctp-dev libpcap-dev libncurses-dev libssl-dev
          git clone --depth 1 --branch v3.7.7 https://github.com/SIPp/sipp.git /tmp/sipp
          cd /tmp/sipp && cmake . -DUSE_SCTP=1 -DUSE_PCAP=1 -DUSE_SSL=1 && make -j"$(nproc)"
          /tmp/sipp/sipp -v | head -1
      - name: Clippy (sctp feature)
        run: cargo clippy --workspace --all-targets --features sctp -- -D warnings
      - name: Tests (sctp feature)
        run: cargo test --workspace --features sctp
      - name: SCTP interop against real SIPp
        run: SIPP_BIN=/tmp/sipp/sipp cargo test --features sctp --test interop sctp -- --nocapture
