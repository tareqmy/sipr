[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["tareqmy"]
repository = "https://github.com/tareqmy/sipr"
homepage = "https://github.com/tareqmy/sipr"
license = "MIT"
keywords = ["sip", "sipp", "voip", "load-testing", "telephony"]
categories = ["network-programming", "command-line-utilities", "development-tools::testing"]

[workspace.dependencies]
# Internal crates (path + version so each is publishable to crates.io).
# External crates from the sanctioned set (docs/CONVENTIONS.md §Dependencies)
# are added here when a milestone first needs them.
sipr-scenario = { path = "crates/sipr-scenario", version = "0.5.0" }
sipr-net = { path = "crates/sipr-net", version = "0.5.0" }
sipr-engine = { path = "crates/sipr-engine", version = "0.5.0" }
sipr-auth = { path = "crates/sipr-auth", version = "0.5.0" }
sipr-stats = { path = "crates/sipr-stats", version = "0.5.0" }
sipr-tui = { path = "crates/sipr-tui", version = "0.5.0" }
sipr-media = { path = "crates/sipr-media", version = "0.5.0" }
# TLS (M13): rustls with the `ring` provider, NOT the default `aws-lc-rs` —
# ring builds with `cc` alone (no cmake, no system OpenSSL), keeping the
# build portable (docs/CONVENTIONS.md §Dependencies).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
# Test-only: generate self-signed certificates at test time (no expiring
# PEM fixtures in the repo).
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "allow"

[package]
name = "sipr"
description = "A SIPp-like SIP testing tool and traffic generator, written in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
sipr-scenario = { workspace = true }
sipr-engine = { workspace = true }
sipr-stats = { workspace = true }
sipr-tui = { workspace = true }

[dev-dependencies]
sipr-net = { workspace = true }
sipr-auth = { workspace = true }
# pcap fixture builders for the media e2e/interop tests.
sipr-media = { workspace = true }
# Scripted TLS peers in tests/e2e.rs and cert generation for interop.
rustls = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
